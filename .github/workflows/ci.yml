name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The repeat runs below compare tests and specs against main.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The whole unit suite runs again, five times, so a test that passes
      # only by timing (such as reading a section before it has loaded) fails
      # here rather than weeks later. All of it, not just the changed tests:
      # a race can wait for other tests to add load (two Saved searches tests
      # passed their own PR and failed on #13's).
      - run: npm run test:repeat
      - run: npm run build
      # Browsers are cached per Playwright version; a hit still needs the
      # system libraries, which live outside the cache.
      - id: playwright-version
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # Playwright serves the dist/ built above.
      - run: npm run test:e2e
      # New or changed specs run again, repeatedly and in parallel, so a test
      # that fails only under load fails here rather than weeks later.
      - run: npx playwright test --only-changed=origin/main --pass-with-no-tests --repeat-each 5 --workers 4
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    # ADR-0003: pushes to main deploy the static build to GitHub Pages.
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
